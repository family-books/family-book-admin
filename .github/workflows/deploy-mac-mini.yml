name: Legacy manual deploy website and admin to Mac mini

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: familybook-website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macOS, ARM64, familybook-admin-prod]
    timeout-minutes: 15
    steps:
      - name: Check out the CI-verified commit
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Build and atomically deploy the verified commit
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: /bin/bash deploy/prod/deploy-on-mac-mini.sh "$VERIFIED_SHA" "$GITHUB_WORKSPACE"
