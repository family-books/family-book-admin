name: Deploy website and admin to Tencent Cloud

on:
  workflow_run:
    workflows: [Website CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: familybook-website-tencent-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TENCENT_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_familybook_deploy
          chmod 600 ~/.ssh/id_familybook_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and verify
        env:
          HOST: ${{ secrets.TENCENT_SSH_HOST }}
          USER: ${{ secrets.TENCENT_SSH_USER }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i ~/.ssh/id_familybook_deploy "$USER@$HOST" \
            "sudo /usr/local/sbin/deploy-family-book-admin '$SHA'"
